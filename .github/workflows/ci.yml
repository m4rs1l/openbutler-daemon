name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the exact toolchain pinned by rust-toolchain.toml.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # The sidecar acceptance tests spawn the real Node process, which
      # imports its dependencies from sidecar/node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: npm ci
        working-directory: sidecar
      - run: cargo test
