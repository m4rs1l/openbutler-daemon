[workspace]
resolver = "3"
members = ["crates/daemon"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

# Every dependency version is declared exactly once, here. Crates opt in with
# `dep = { workspace = true }`, so a version bump is a one-line change and two
# crates can never drift onto different serde lines.
[workspace.dependencies]
openbutler-protocol = { git = "https://github.com/m4rs1l/openbutler-protocol", rev = "c6bb9d447f5411bb32af4e030131c5ea2b94cd3f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1.1"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
notify = "8.2.2"
sysinfo = "0.40.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "process",
    "sync",
    "io-util",
    "macros",
    "time",
    "signal",
] }
url = "2"

# Workspace-wide lints. Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Dev builds keep backtrace line numbers without the full debuginfo
# payload: line tables cut the artifact size roughly in half and pin the
# target directory's growth (debug assertions stay on by default).
[profile.dev]
debug = "line-tables-only"
