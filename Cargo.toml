[workspace]
resolver = "3"
members = ["crates/protocol", "crates/daemon"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

# Every dependency version is declared exactly once, here. Crates opt in with
# `dep = { workspace = true }`, so a version bump is a one-line change and two
# crates can never drift onto different serde lines.
[workspace.dependencies]
openbutler-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1.1"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
chrono = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "macros",
    "time",
    "signal",
] }
url = "2"

# Workspace-wide lints. Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
